# Netlify hosts the CLIENT ONLY. The Express + MongoDB API in server/ cannot run
# here — deploy that to Railway / Render / Fly / a VPS and point VITE_API_URL at
# it (Site settings → Environment variables). It is read at BUILD time, so
# changing it requires a redeploy.

[build]
  # These paths are relative to the Netlify "Base directory", which is set to
  # `client` in the site UI — Netlify has already cd'd there before running
  # this. So no `client/` prefix and no --prefix: adding either produces
  # client/client/dist and the build fails.
  #
  # IF YOU EVER CLEAR THE BASE DIRECTORY, change these to:
  #   command = "npm --prefix client ci && npm --prefix client run build"
  #   publish = "client/dist"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The invitation routes are client-side, so every unmatched path must return the
# app shell. Real files (/assets/*) still win over this rule — Netlify serves an
# existing file before applying a redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
